<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e30613">
  <title>Abonnement en cours - Canonplus</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #292929;
      background: #f7f7f8;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      background:
        radial-gradient(ellipse at 50% 0, rgba(227, 6, 19, 0.09), transparent 50%),
        #f7f7f8;
    }

    .page {
      display: flex;
      min-height: 100vh;
      min-height: 100svh;
      flex-direction: column;
      align-items: center;
      padding: max(28px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 10px 0 42px;
      color: #e30613;
      font-size: 27px;
      font-weight: 750;
      letter-spacing: -1.2px;
    }

    .brand-mark {
      width: 29px;
      height: 29px;
      object-fit: cover;
    }

    main {
      width: min(100%, 440px);
      margin: auto 0;
    }

    .status-card {
      overflow: hidden;
      border: 1px solid #ededf0;
      border-radius: 26px;
      background: #fff;
      box-shadow: 0 18px 55px rgba(34, 34, 43, 0.09);
      text-align: center;
    }

    .card-top {
      padding: 38px 28px 30px;
    }

    .status-visual {
      display: grid;
      width: 112px;
      height: 112px;
      margin: 0 auto 28px;
      place-items: center;
      border-radius: 50%;
      background: #fff1f2;
    }

    .spinner {
      width: 58px;
      height: 58px;
      border: 5px solid #ffd5d8;
      border-top-color: #e30613;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    h1 {
      margin: 0;
      color: #252525;
      font-size: clamp(25px, 6vw, 32px);
      font-weight: 750;
      letter-spacing: -0.8px;
      line-height: 1.2;
    }

    .intro {
      max-width: 330px;
      margin: 14px auto 0;
      color: #666872;
      font-size: 16px;
      line-height: 1.6;
    }

    .divider {
      height: 1px;
      margin: 0;
      border: 0;
      background: #eeeef1;
    }

    .status-message {
      display: flex;
      align-items: flex-start;
      gap: 13px;
      padding: 22px 25px 24px;
      color: #565760;
      text-align: left;
    }

    .info-icon {
      display: grid;
      width: 25px;
      height: 25px;
      flex: 0 0 25px;
      place-items: center;
      border-radius: 50%;
      background: #fff1f2;
      color: #d20a16;
      font-size: 15px;
      font-weight: 800;
    }

    .status-message p {
      margin: 1px 0 0;
      font-size: 14px;
      line-height: 1.55;
    }

    .home-link {
      display: inline-flex;
      min-height: 52px;
      align-items: center;
      justify-content: center;
      gap: 9px;
      margin-top: 22px;
      padding: 0 24px;
      border: 0;
      border-radius: 15px;
      background: #e30613;
      box-shadow: 0 8px 18px rgba(227, 6, 19, 0.2);
      color: #fff;
      font: inherit;
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .home-link:hover {
      transform: translateY(-1px);
      background: #c9000c;
    }

    .home-link:focus-visible {
      outline: 3px solid rgba(227, 6, 19, 0.3);
      outline-offset: 3px;
    }

    footer {
      padding-top: 32px;
      color: #9a9ba2;
      font-size: 12px;
      text-align: center;
    }

    @media (max-width: 380px) {
      .brand { margin-bottom: 28px; }
      .card-top { padding: 30px 22px 25px; }
      .status-message { padding: 19px 20px 21px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="brand" aria-label="Max it RDC">
      <img class="brand-mark" src="assets/img/OIP.jpg" alt="Max it RDC">
    </header>

    <main>
      <section class="status-card" aria-labelledby="page-title">
        <div class="card-top">
          <div class="status-visual" role="status" aria-label="Traitement en cours">
            <div class="spinner" aria-hidden="true"></div>
          </div>
          <h1 id="page-title">Votre abonnement est en cours de traitement</h1>
          <p class="intro">Nous préparons l’activation de votre abonnement Canonplus.</p>
        </div>

        <hr class="divider">

        <div class="status-message">
          <span class="info-icon" aria-hidden="true">i</span>
          <p>Il sera activé dans quelques instants. Vous recevrez un SMS dès que l’activation sera terminée.</p>
        </div>
      </section>

      <a class="home-link" href="index.html">
        <span aria-hidden="true">←</span>
        Retour à l’accueil
      </a>
    </main>

    <footer>© 2026 Canonplus. Tous droits réservés.</footer>
  </div>
</body>
</html>
